<div class="pagina-auth">
  <section class="imagem-container">
    <div class="carousel">
      <img ngSrc="/img/card-login-1.png" width="600" height="800" alt="Imagem de login - duas garotas sorrindo em um fundo cor de rosa" />
    </div>
  </section>

  <main class="auth-container">
    <section class="auth-card">
      <!-- Header com tabs -->
      <div class="auth-header">
        <button class="tab-button active" data-tab="login">
          LOGIN
        </button>
        <button class="tab-button" data-tab="register" (click)="navegarParaRegister()">
          CADASTRO
        </button>
        <div class="tab-indicator"></div>
      </div>

      <!-- Formulário de Login -->
      <form class="auth-form active" (ngSubmit)="login()" #loginForm="ngForm">
        <div class="input-container">
          <input type="email" id="login-email" class="input-field" placeholder=" " 
                [(ngModel)]="usuario" name="usuario" required email>
          <label for="login-email" class="input-label">E-mail</label>
        </div>

        <div class="input-container">
          <input [type]="hide() ? 'password' : 'text'" id="login-senha" class="input-field" placeholder=" "
                [(ngModel)]="senha" name="senha" required>
          <label for="login-senha" class="input-label">Senha</label>
          <button type="button" class="toggle-password" (click)="clickEvent($event)">
            <span class="material-icons">{{ hide() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <div class="options-container">
          <label class="remember-me">
            <input type="checkbox">
            Lembrar-me
          </label>
          <a href="#" class="forgot-password" (click)="$event.preventDefault()">Esqueci minha senha</a>
        </div>

        <button type="submit" class="botao-principal" [disabled]="!loginForm.form.valid">
          Entrar
        </button>

        <div class="auth-footer">
          <p>Não tem uma conta? <a href="#" (click)="navegarParaRegister(); $event.preventDefault()">Clique aqui para se cadastrar!</a></p>
        </div>
      </form>

      <!-- Seção de Visitante -->
      <div class="guest-section">
        <div class="separator">
          <span>ou</span>
        </div>
        <button type="button" class="botao-convidado" (click)="continueAsGuest()">
          Continuar como visitante
        </button>
      </div>
    </section>
  </main>
</div>
