<div class="pagina-auth">
  <section class="imagem-container">
    <div class="static-image">
      <img 
        [ngSrc]="'/img/card-login.png'" 
        alt="Duas garotas sorrindo em um fundo cor de rosa" 
        width="600" 
        height="800" 
        priority="true" />
    </div>
  </section>

  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-header">
        <button class="tab-button active">
          LOGIN
        </button>
        <button class="tab-button" (click)="navigateToRegister()">
          CADASTRO
        </button>
        <div class="tab-indicator"></div>
      </div>

      <form class="auth-form" (ngSubmit)="login()" #loginForm="ngForm">
        <div class="input-container">
          <input 
            type="email" 
            id="login-email" 
            class="input-field" 
            placeholder=" " 
            [(ngModel)]="usuario" 
            name="usuario" 
            required 
            email>
          <label for="login-email" class="input-label">E-mail</label>
        </div>

        <div class="input-container">
          <input 
            [type]="hide() ? 'password' : 'text'" 
            id="login-senha" 
            class="input-field" 
            placeholder=" "
            [(ngModel)]="senha" 
            name="senha" 
            required>
          <label for="login-senha" class="input-label">Senha</label>
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility($event)">
            <span class="material-icons">{{ hide() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>

        <div class="options-container">
          <label class="remember-me">
            <input type="checkbox">
            Lembrar-me
          </label>
          <a href="#" class="forgot-password" (click)="$event.preventDefault()">
            Esqueci minha senha
          </a>
        </div>

        <button 
          type="submit" 
          class="botao-principal" 
          [disabled]="!loginForm.form.valid || isLoading">
          @if (isLoading) {
            <span>Carregando...</span>
          } @else {
            <span>Entrar</span>
          }
        </button>

        <div class="auth-footer">
          <p>
            Não tem uma conta? 
            <a href="#" (click)="navigateToRegister(); $event.preventDefault()">
              Clique aqui para se cadastrar!
            </a>
          </p>
        </div>
      </form>

      <div class="guest-section">
        <div class="separator">
          <span>ou</span>
        </div>
        <button type="button" class="botao-convidado" (click)="continueAsGuest()">
          Continuar como visitante
        </button>
      </div>
    </section>
  </main>
</div>
