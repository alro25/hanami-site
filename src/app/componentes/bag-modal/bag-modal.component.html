<div class="bag-modal">
  <h2>Minha Sacola</h2>

  @if (bagService.bagItems().length === 0) {
    <div class="empty-bag">
      <p>Sua sacola está vazia</p>
      <button class="btn btn-outline" (click)="continueShopping()">Continuar Comprando</button>
    </div>
  } @else {
    <div class="bag-items">
      @for (item of bagService.bagItems(); track item.product.id) {
        <div class="bag-item">
          <div class="item-image">
            <img [src]="item.product.imageUrl" [alt]="item.product.name">
          </div>
          <div class="item-details">
            <h3>{{ item.product.name }}</h3>
            <p class="item-price">R$ {{ formatPrice(item.product.price) }}</p>
            <div class="quantity-controls">
              <button 
                class="quantity-btn" 
                (click)="updateQuantity(item.product.id, item.quantity - 1)"
                [disabled]="item.quantity <= 1">
                −
              </button>
              <span class="quantity">{{ item.quantity }}</span>
              <button 
                class="quantity-btn" 
                (click)="updateQuantity(item.product.id, item.quantity + 1)">
                +
              </button>
            </div>
          </div>
          <button class="remove-btn" (click)="removeItem(item.product.id)" aria-label="Remover item">
            ×
          </button>
        </div>
      }
    </div>

    <div class="bag-footer">
      <div class="bag-total">
        <span>Total:</span>
        <strong>R$ {{ formatPrice(bagService.totalPrice()) }}</strong>
      </div>
      <button class="btn btn-dark checkout-btn" (click)="proceedToCheckout()">
        Finalizar Compra
      </button>
    </div>
  }
</div>
