<h2>Minha Conta</h2>

@if (authService.isAuthenticated()) {
  <!-- User is LOGGED IN -->
  <div class="user-section">
    <p class="welcome-message">
      Olá, <strong>{{ authService.getUsername() }}</strong>!
    </p>
    
    <div class="menu-links">
      <a href="#" (click)="goToDashboard($event)" class="modal-link">
        <span class="icon">📊</span>
        Acessar Dashboard
      </a>
      
      <a href="#" class="modal-link" (click)="$event.preventDefault(); uiService.closeAllModals()">
        <span class="icon">👤</span>
        Meus Dados
      </a>
      
      <a href="#" class="modal-link" (click)="$event.preventDefault(); uiService.closeAllModals()">
        <span class="icon">📦</span>
        Meus Pedidos
      </a>
      
      <a href="#" class="modal-link" (click)="$event.preventDefault(); uiService.closeAllModals()">
        <span class="icon">❤️</span>
        Favoritos
      </a>
    </div>

    <button class="btn btn-outline logout-btn" (click)="logout()">
      <span class="icon">🚪</span>
      Sair
    </button>
  </div>
} @else {
  <!-- User is NOT logged in -->
  <div class="guest-section">
    <p class="welcome-message">
      Faça login para acessar todos os recursos!
    </p>
    
    <div class="menu-links">
      <a href="#" (click)="goToLogin($event)" class="modal-link">
        <span class="icon">🔑</span>
        Fazer Login
      </a>
      
      <a href="#" (click)="goToRegister($event)" class="modal-link">
        <span class="icon">📝</span>
        Criar Conta
      </a>
      
      <a href="#" class="modal-link" (click)="$event.preventDefault(); uiService.closeAllModals()">
        <span class="icon">🔍</span>
        Recuperar Senha
      </a>
    </div>
  </div>
}
